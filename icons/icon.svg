<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18263E"/>
      <stop offset="100%" stop-color="#0A0F1D"/>
    </radialGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E599"/>
      <stop offset="100%" stop-color="#05D5A4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#05D5A4" stroke-width="8"/>
  <circle cx="256" cy="256" r="225" fill="none" stroke="#233554" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- GPS Wave Rings -->
  <ellipse cx="256" cy="380" rx="120" ry="25" fill="none" stroke="#F59E0B" stroke-width="4" opacity="0.6"/>
  <ellipse cx="256" cy="380" rx="70" ry="15" fill="none" stroke="#05D5A4" stroke-width="4" opacity="0.8"/>

  <!-- Runner Figure (Dynamic silhouette with glow) -->
  <g filter="url(#glow)">
    <!-- Head -->
    <circle cx="290" cy="140" r="32" fill="url(#tealGrad)"/>

    <!-- Torso -->
    <path d="M 270 185 L 295 180 L 255 295 L 225 290 Z" fill="url(#tealGrad)"/>

    <!-- Left Arm (Back) -->
    <path d="M 270 195 L 205 210 L 195 245" fill="none" stroke="#38BDF8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right Arm (Front) -->
    <path d="M 290 190 L 350 215 L 375 195" fill="none" stroke="#38BDF8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Left Leg (Trailing back) -->
    <path d="M 235 290 L 160 330 L 120 315" fill="none" stroke="url(#tealGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right Leg (Stepping forward) -->
    <path d="M 250 290 L 325 340 L 305 405" fill="none" stroke="url(#tealGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Speed Lines -->
  <path d="M 90 220 L 150 220" stroke="#05D5A4" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 70 250 L 130 250" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  <path d="M 95 280 L 140 280" stroke="#05D5A4" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
</svg>
